<style>

canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none}
#back{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;padding:0;border:1px solid #19e6ff;border-radius:50%;background:rgba(0,8,12,.55);color:#19e6ff;font:400 22px/1 system-ui,sans-serif;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#back:active{background:rgba(25,230,255,.18)}
#back[hidden]{display:none}

<body>
<button id="back" hidden aria-label="Back">&#x2039;</button>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- mock stream: dirs as spheres in space, items inside ----------
// Each dir: name, counts, position in space, and its items [name, category, weight, public, heat]
const dirs = [
  { name: 'srdjan',    at: [0, 0, 0], items: [
    ['README.md', 'document', 0.4, false, 0.2], ['fortress.mp4', 'video', 0.95, true, 0.9], ['IMG-2026-09-01.jpg', 'image', 0.6, false, 0.3],
    ['IMG-2026-09-03.jpg', 'image', 0.5, true, 0.6], ['notes.pdf', 'document', 0.5, false, 0.1], ['trip.mp4', 'video', 0.7, true, 0.5],
    ['IMG-2026-08-12.jpg', 'image', 0.75, false, 0.4], ['backup.zip', 'archive', 0.85, false, 0.0]] },
  { name: 'Pictures',  at: [-26, 6, -14], items: [
    ['DSC_0412.jpg', 'image', 0.7, false, 0.2], ['DSC_0413.jpg', 'image', 0.6, false, 0.1], ['DSC_0420.jpg', 'image', 0.8, true, 0.7],
    ['DSC_0431.jpg', 'image', 0.5, false, 0.0], ['DSC_0440.jpg', 'image', 0.65, false, 0.3], ['panorama.jpg', 'image', 0.95, true, 0.8],
    ['DSC_0451.jpg', 'image', 0.45, false, 0.0], ['DSC_0458.jpg', 'image', 0.55, false, 0.1], ['DSC_0460.jpg', 'image', 0.5, false, 0.2],
    ['DSC_0471.jpg', 'image', 0.6, false, 0.0], ['DSC_0479.jpg', 'image', 0.7, true, 0.4], ['DSC_0488.jpg', 'image', 0.4, false, 0.0]] },
  { name: 'Viber',     at: [24, -4, -10], items: [
    ['IMG-Viber-01.jpg', 'image', 0.5, false, 0.6], ['IMG-Viber-02.jpg', 'image', 0.6, false, 0.5], ['VID-Viber-03.mp4', 'video', 0.8, false, 0.9],
    ['IMG-Viber-04.jpg', 'image', 0.4, false, 0.2], ['voice-05.m4a', 'audio', 0.3, false, 0.1], ['IMG-Viber-06.jpg', 'image', 0.55, true, 0.7],
    ['doc-07.pdf', 'document', 0.45, false, 0.0], ['IMG-Viber-08.jpg', 'image', 0.5, false, 0.3], ['VID-Viber-09.mp4', 'video', 0.7, false, 0.4]] },
  { name: 'src',       at: [6, 14, -30], items: [
    ['index.ts', 'code', 0.6, false, 0.8], ['scene.ts', 'code', 0.9, false, 0.9], ['stream.ts', 'code', 0.7, false, 0.6],
    ['legend.ts', 'code', 0.5, false, 0.3], ['package.json', 'document', 0.3, false, 0.2], ['README.md', 'document', 0.4, false, 0.1]] },
  { name: 'Instagram', at: [-8, -12, -26], items: [
    ['sunset-fortress', 'carousel', 0.9, true, 0.9], ['danube-morning', 'image', 0.7, true, 0.6], ['fruska-gora', 'image', 0.6, true, 0.4],
    ['exit-2026', 'video', 0.85, true, 0.8], ['petrovaradin', 'image', 0.65, true, 0.5], ['studio', 'image', 0.5, true, 0.2], ['bikes', 'image', 0.55, true, 0.3]] },
  { name: 'Downloads', at: [30, 12, -34], items: [
    ['invoice-0912.pdf', 'document', 0.3, false, 0.0], ['setup.dmg', 'archive', 0.9, false, 0.1], ['ticket.pdf', 'document', 0.35, false, 0.2],
    ['export.zip', 'archive', 0.8, false, 0.0], ['screenshot.png', 'image', 0.4, false, 0.1]] },
];

// ---------- palette (Tron default world) ----------
const CYAN = new THREE.Color(0x19e6ff);
const ORANGE = new THREE.Color(0xff7a1a);
const DIM = new THREE.Color(0x0f7a92);
const FACE = 0x04070c;

// ---------- scene ----------
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 60, 320);

const camera = new THREE.PerspectiveCamera(60, W / H, 0.05, 600);
scene.add(camera);

// a faint reference grid far below the spheres, so space has an up
(function floorGrid() {
  const pts = [], S = 240, st = 6, y = -30;
  for (let x = -S; x <= S; x += st) pts.push(x, y, -S, x, y, S);
  for (let z = -S; z <= S; z += st) pts.push(-S, y, z, S, y, z);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x062a34 })));
})();

// ---------- text (canvas textures) ----------
function textPlane(lines, w, color = '#19e6ff') {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  ctx.font = '700 96px "DejaVu Sans", Arial, sans-serif'; ctx.fillText(lines[0], 512, lines[1] ? 92 : 128);
  if (lines[1]) { ctx.font = '400 56px "DejaVu Sans", Arial, sans-serif'; ctx.globalAlpha = 0.85; ctx.fillText(lines[1], 512, 190); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return new THREE.Mesh(new THREE.PlaneGeometry(w, w / 4), new THREE.MeshBasicMaterial({ map: t, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
}

function outlined(geo, lineColor, faceColor = FACE) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: faceColor, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 })));
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: lineColor })));
  return g;
}

// ---------- items: shape by category, size by weight, colour by public, glow by heat ----------
function itemMesh([name, cat, weight, pub, heat], u) {
  const base = pub ? ORANGE : CYAN;
  const line = base.clone().multiplyScalar(0.55 + heat * 0.8);
  const g = new THREE.Group();
  let half = u;
  if (cat === 'image' || cat === 'carousel') {
    const w = u * (1.2 + weight * 1.6), h = w * 0.75;
    g.add(outlined(new THREE.BoxGeometry(w, h, u * 0.08), line, 0x060c14)); half = h / 2;
    if (cat === 'carousel') { const b = outlined(new THREE.BoxGeometry(w, h, u * 0.08), base.clone().multiplyScalar(0.5), 0x060c14); b.position.set(u * 0.25, -u * 0.25, -u * 0.3); g.add(b); }
  } else if (cat === 'video') {
    const w = u * (1.3 + weight * 1.7), h = w * 0.5625;
    const p = outlined(new THREE.BoxGeometry(w, h, u * 0.08), line, 0x060c14); p.position.y = u * 0.35; g.add(p);
    const b = outlined(new THREE.BoxGeometry(w * 0.7, u * 0.3, u * 0.5), base.clone().multiplyScalar(0.9)); b.position.y = -h / 2 + u * 0.1; g.add(b); half = h / 2 + u * 0.35;
  } else if (cat === 'document') {
    const h = u * (0.2 + weight * 0.9); g.add(outlined(new THREE.BoxGeometry(u * 1.2, h, u * 0.9), line)); half = h / 2;
  } else if (cat === 'code') {
    const h = u * (1.0 + weight * 1.6); g.add(outlined(new THREE.BoxGeometry(u * 0.5, h, u * 0.5), line)); half = h / 2;
  } else if (cat === 'audio') {
    g.add(outlined(new THREE.CylinderGeometry(u * 0.5, u * 0.5, u * 0.3, 16), line)); half = u * 0.4;
  } else {
    const s = u * (0.8 + weight * 0.9); g.add(outlined(new THREE.BoxGeometry(s, s, s), line)); half = s / 2;
  }
  const lbl = textPlane([name], u * 4, pub ? '#ff7a1a' : '#19e6ff'); lbl.position.y = -half - u * 0.6; lbl.material.opacity = 0.8; g.add(lbl);
  g.userData = { kind: 'item', name, radius: half * 1.8 };
  return g;
}

// ---------- spheres: one per dir, items on a spiral inside ----------
const spheres = [], items = [];
for (const d of dirs) {
  const R = 3.2 + Math.sqrt(d.items.length) * 1.1;
  const g = new THREE.Group(); g.position.set(...d.at);
  // shell: faint fill (also the tap target) and a sparse wireframe
  const fill = new THREE.Mesh(new THREE.SphereGeometry(R, 32, 24), new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.025, depthWrite: false }));
  fill.userData = { kind: 'dir', dir: d, R, group: g };
  const wire = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.SphereGeometry(R, 10, 6)), new THREE.LineBasicMaterial({ color: DIM, transparent: true, opacity: 0.16 }));
  const equator = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(new THREE.EllipseCurve(0, 0, R, R, 0, Math.PI * 2, false, 0).getPoints(96).map(p => new THREE.Vector3(p.x, 0, p.y))), new THREE.LineBasicMaterial({ color: CYAN, transparent: true, opacity: 0.6 }));
  fill.userData.wire = wire;
  g.add(fill, wire, equator);
  // label above the sphere, billboarded
  const lbl = textPlane([d.name, `${d.items.length} items`], R * 1.6); lbl.position.y = R + 1.0; lbl.userData.billboard = true; g.add(lbl);
  // items on a fibonacci spiral at 0.6 R so they read from outside and from within
  const u = R * 0.09, n = d.items.length, golden = Math.PI * (3 - Math.sqrt(5));
  d.items.forEach((it, i) => {
    const y = 1 - (i / Math.max(1, n - 1)) * 2, r = Math.sqrt(1 - y * y), th = golden * i;
    const m = itemMesh(it, u);
    m.position.set(Math.cos(th) * r, y, Math.sin(th) * r).multiplyScalar(R * 0.6);
    m.userData.billboard = true; m.userData.sphere = fill;
    g.add(m); items.push(m);
  });
  scene.add(g); spheres.push(fill);
}
const billboards = []; scene.traverse(o => { if (o.userData.billboard) billboards.push(o); });

// ---------- views and the zoom stack ----------
const overview = { pos: new THREE.Vector3(4, 10, 72), target: new THREE.Vector3(2, 2, -16) };
let view = { pos: overview.pos.clone(), target: overview.target.clone() };
const stack = [];                                   // views to go back to
let tween = null;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function zoomTo(pos, target, dur = 0.5) {
  tween = { from: { pos: view.pos.clone(), target: view.target.clone() }, to: { pos, target }, t0: performance.now(), dur: dur * 1000 };
}
function focusSphere(fill) {
  const c = fill.userData.group.position.clone();
  const dir = view.pos.clone().sub(c).normalize();
  stack.push({ pos: view.pos.clone(), target: view.target.clone() });
  zoomTo(c.clone().add(dir.multiplyScalar(fill.userData.R * 2.6)), c);
}
function focusItem(m) {
  const p = new THREE.Vector3(); m.getWorldPosition(p);
  const dir = view.pos.clone().sub(p).normalize();
  stack.push({ pos: view.pos.clone(), target: view.target.clone() });
  zoomTo(p.clone().add(dir.multiplyScalar(m.userData.radius * 4.5)), p);
}
function back() { const v = stack.pop(); if (v) zoomTo(v.pos, v.target); }

// ---------- back button: a fixed overlay outside the scene ----------
const backBtn = document.getElementById('back');
backBtn.addEventListener('click', back);
function placeHud() { backBtn.hidden = stack.length === 0; }

// ---------- input: tap to zoom, drag to orbit the current target ----------
const cv = renderer.domElement;
const ray = new THREE.Raycaster();
let press = null, orbit = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); press = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() }; orbit = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointermove', e => {
  if (!orbit || tween) return;
  const dx = e.clientX - orbit.x, dy = e.clientY - orbit.y; orbit.x = e.clientX; orbit.y = e.clientY;
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) press.moved = true;
  if (!press?.moved) return;
  const off = view.pos.clone().sub(view.target);
  const sph = new THREE.Spherical().setFromVector3(off);
  sph.theta -= dx * 0.005; sph.phi = Math.max(0.15, Math.min(Math.PI - 0.15, sph.phi - dy * 0.005));
  view.pos.copy(view.target).add(off.setFromSpherical(sph));
});
cv.addEventListener('pointerup', e => {
  const p = press; press = null; orbit = null;
  if (!p || p.moved || performance.now() - p.t > 500) return;
  tap(e.clientX, e.clientY);
});
cv.addEventListener('pointercancel', () => { press = null; orbit = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => { if (e.code === 'Escape' || e.code === 'Backspace') back(); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });

function tap(x, y) {
  if (tween) return;
  ray.setFromCamera(new THREE.Vector2((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  // items first, so a tap inside a focused sphere picks the item, not the shell
  const hitItems = ray.intersectObjects(items, true);
  if (hitItems.length) { let o = hitItems[0].object; while (o && o.userData.kind !== 'item') o = o.parent; if (o) return focusItem(o); }
  const hitSpheres = ray.intersectObjects(spheres, false);
  if (hitSpheres.length) return focusSphere(hitSpheres[0].object);
}

// ---------- bloom ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.22, 0.15, 0.7));   // a hint of bloom only; edges stay sharp
composer.addPass(new OutputPass());

window.__nav = () => ({ level: stack.length, pos: view.pos.toArray().map(v => +v.toFixed(2)), target: view.target.toArray().map(v => +v.toFixed(2)), zooming: !!tween });
window.__tap = tap; window.__spheres = spheres; window.__items = items; window.__camera = camera; window.__T = THREE;
let frames = 0;
function loop() {
  if (tween) {
    const k = ease(Math.min(1, (performance.now() - tween.t0) / tween.dur));
    view.pos.lerpVectors(tween.from.pos, tween.to.pos, k);
    view.target.lerpVectors(tween.from.target, tween.to.target, k);
    if (k >= 1) tween = null;
  }
  camera.position.copy(view.pos); camera.lookAt(view.target);
  for (const b of billboards) b.quaternion.copy(camera.quaternion);
  // fade the shell of the sphere the camera is inside, so it does not cross the focused item
  for (const f of spheres) {
    const inside = camera.position.distanceTo(f.userData.group.position) < f.userData.R * 1.05;
    f.material.opacity += ((inside ? 0.0 : 0.025) - f.material.opacity) * 0.2;
    f.userData.wire.material.opacity += ((inside ? 0.04 : 0.16) - f.userData.wire.material.opacity) * 0.2;
  }
  placeHud();
  composer.render();
  if (++frames === 3) window.__done = true;   // screenshot.mjs waits for this
  requestAnimationFrame(loop);
}
loop();
</script>
